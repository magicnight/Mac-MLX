name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.omc/**'
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - 'CITATIONS.bib'
      - 'LICENSE'
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.omc/**'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: {}

# Minute budget notes:
#   - Only code changes trigger CI (paths-ignore filters docs/plans).
#   - Consecutive pushes to the same ref cancel the older run.
#   - SPM resolution + MLX C++ compile is cached across runs (~7min -> ~2min).
#   - Use "[skip ci]" in a commit message to bypass entirely.
#   - scripts/ci-local.sh mirrors these jobs step for step; change both.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MACMLX_SKIP_LOG_MANAGER_TESTS: "1"

jobs:
  website:
    name: Static Website Build & Test
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Show Node.js
        run: node --version

      - name: Build and verify static website
        run: |
          node scripts/validate-social-cards.mjs
          node scripts/build-public-site.mjs
          node --test site/tests/*.test.mjs
          node scripts/crawl-public-site.mjs
          node scripts/test-public-site.mjs
          node --check scripts/build-public-site.mjs
          node --check scripts/crawl-public-site.mjs
          node --check scripts/render-brand-icons.mjs
          node --check scripts/render-social-cards.mjs
          node --check scripts/validate-social-cards.mjs
          node --check scripts/verify-cloudflare-deploy.mjs
          node --check site/lib/install-manifest.mjs
          node --check site/lib/png-source-digest.mjs
          node --check site/cloudflare/www-redirect.mjs
          node --check scripts/verify-www-redirect.mjs
          node --check public/assets/js/main.js
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout site/assets/brand/macmlx-mark.svg site/assets/brand/favicon.svg public/assets/og-image.svg public/sitemap.xml
          fi

  spm:
    name: SPM Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Xcode 26.4.1 ships Swift 6.3, which (unlike 6.0 in Xcode 16.4)
      # tolerates mlx-swift-lm's `private let context = CIContext()` in
      # MLXVLM/MediaProcessing.swift under strict concurrency. Pinning to
      # the GA build (not the 26.5 beta) so toolchain churn stays low.
      - name: Pin Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Cache SPM checkouts + build
        uses: actions/cache@v5
        with:
          path: |
            MacMLXCore/.build
            macmlx-cli/.build
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('MacMLXCore/Package.resolved', 'macmlx-cli/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve & test MacMLXCore
        # The VLM registry mirror test reads mlx-swift-lm's source from the
        # scratch directory; here a missing checkout fails it rather than skip.
        env:
          MACMLX_REQUIRE_RESOLVED_SOURCE: "1"
        run: |
          swift package --package-path MacMLXCore resolve
          swift test --package-path MacMLXCore

      - name: Resolve & test macmlx-cli
        run: |
          swift package --package-path macmlx-cli resolve
          swift test --package-path macmlx-cli

      # The two resolves above rewrite Package.resolved in place when a manifest
      # has moved on without it. That self-healing is why a Swift test cannot
      # police its own lockfile — by the time assertions run, the file has
      # already been corrected — so the check has to live out here, where the
      # rewrite itself is the evidence.
      #
      # A stale lockfile does not break the build (SwiftPM re-resolves), but it
      # leaves a checked-in file naming an engine revision nobody runs. That is
      # the same quiet mismatch that let the CLI ship against upstream mlx-swift
      # while the app used the controlled fork.
      - name: Lockfiles are up to date
        run: |
          if ! git diff --exit-code -- MacMLXCore/Package.resolved macmlx-cli/Package.resolved; then
            echo "::error::A Package.resolved changed during resolve — the checked-in lockfile is stale."
            echo "Run 'swift package --package-path <pkg> resolve' locally and commit the result."
            exit 1
          fi

      # The CLI ships its own graph; every package MacMLXCore pins, it must pin
      # the same way, or the Homebrew tarball runs code the tests did not (#149).
      - name: The CLI lockfile agrees with MacMLXCore's
        run: python3 scripts/check-lockfile-parity.py --github macmlx-cli/Package.resolved

      - name: Smoke-run macmlx --version
        run: swift run --package-path macmlx-cli macmlx --version

  metal:
    name: Metal Tests (xcodebuild)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Xcode 26.4.1 ships Swift 6.3, which (unlike 6.0 in Xcode 16.4)
      # tolerates mlx-swift-lm's `private let context = CIContext()` in
      # MLXVLM/MediaProcessing.swift under strict concurrency. Pinning to
      # the GA build (not the 26.5 beta) so toolchain churn stays low.
      - name: Pin Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      # Xcode 26 ships the Metal compiler as a separate downloadable
      # component; without it MLX cannot JIT its shaders and every
      # MLX-gated test aborts. No-ops when already installed.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SPM checkouts + DerivedData
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: metal-${{ runner.os }}-${{ hashFiles('MacMLXCore/Package.resolved') }}
          restore-keys: |
            metal-${{ runner.os }}-

      # Runs the FULL MacMLXCore suite in a Metal-capable environment so
      # the MLX-gated tests (LoRA converter, prompt cache, sanitize,
      # indexer behavior, speed sampler) actually execute — under plain
      # `swift test` they self-skip via MLXTestSupport.
      #
      # STRICT NUMERIC PARITY (allClose 1e-4 vs Python fixtures) is
      # additionally skipped here: GitHub's macOS runners expose
      # *paravirtualized* Metal whose matmul/softmax accumulation diverges
      # from real Apple Silicon beyond 1e-4 (observed on macos-26:
      # attention prefill / decoder layer / full-model parity fail while
      # passing on real hardware). MACMLX_UNTRUSTED_METAL=1 makes those
      # suites skip via requireTrustworthyMetalOrSkip; parity remains
      # enforced on developer machines and any future self-hosted
      # Apple Silicon runner (leave the variable unset there). The
      # TEST_RUNNER_ prefix is how xcodebuild forwards env to the xctest
      # process.
      - name: Test MacMLXCore under xcodebuild (Metal)
        working-directory: MacMLXCore
        env:
          TEST_RUNNER_MACMLX_UNTRUSTED_METAL: "1"
        run: |
          xcodebuild test \
            -scheme MacMLXCore \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation

  app:
    name: Xcode App Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Xcode 26.4.1 ships Swift 6.3, which (unlike 6.0 in Xcode 16.4)
      # tolerates mlx-swift-lm's `private let context = CIContext()` in
      # MLXVLM/MediaProcessing.swift under strict concurrency. Pinning to
      # the GA build (not the 26.5 beta) so toolchain churn stays low.
      - name: Pin Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ hashFiles('MacMLXCore/Package.resolved', 'macMLX/macMLX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'macMLX/macMLX.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build macMLX.app (Debug, no signing)
        run: |
          # -skipPackagePluginValidation: mlx-swift 0.31.x and later ship a
          # "CudaBuild" SwiftPM build-tool plugin. xcodebuild otherwise
          # fails validating the (unsigned) plugin in CI. The plugin is
          # a no-op on Apple Silicon / Metal — CUDA never builds here.
          # -onlyUsePackageVersionsFromResolvedFile: the app's workspace
          # lockfile is committed and is the graph that builds; a lockfile
          # the manifests have outgrown fails here instead of being
          # rewritten, as it does for the release archive (scripts/build.sh).
          xcodebuild \
            -project macMLX/macMLX.xcodeproj \
            -scheme macMLX \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build || {
              echo "::error::The app build failed. If the log says 'an out-of-date resolved file was detected', a manifest moved past the committed app lockfile: resolve it without the flag ('xcodebuild -resolvePackageDependencies -project macMLX/macMLX.xcodeproj -scheme macMLX'), check it with scripts/check-lockfile-parity.py and commit it (.claude/distribution.md, 'Moving a dependency')."
              exit 1
            }

      # The app resolved upstream mlx-swift for months while MacMLXCore's own
      # tests resolved the fork, so every cherry-pick was verified in a graph
      # the shipped app did not use; and until #149 the app's lockfile was
      # gitignored, so a release archive took the newest release each manifest
      # allowed on the day (v0.9.0 shipped swift-jinja 2.4.2 after every
      # chat-template test ran on 2.3.6). The lockfile is committed now: it must come through the
      # build unchanged and pin every package MacMLXCore pins the same way,
      # which also proves the resolution honoured the fork declaration that
      # `AppForkPinTests` guards (Core's lockfile names the fork at the
      # revision Core pins, and the spm job keeps that lockfile fresh).
      - name: The app ships the graph the tests ran on
        run: |
          RESOLVED=macMLX/macMLX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if ! git ls-files --error-unmatch "$RESOLVED" >/dev/null 2>&1; then
            echo "::error::$RESOLVED is not committed — the app would resolve a graph of its own."
            exit 1
          fi
          if ! git diff --exit-code -- "$RESOLVED"; then
            echo "::error::$RESOLVED changed during the build — the committed app lockfile is stale."
            echo "Resolve the app's packages in Xcode (or 'xcodebuild -resolvePackageDependencies') and commit the result."
            exit 1
          fi
          python3 scripts/check-lockfile-parity.py --github "$RESOLVED"

      # App-target unit tests. NOT gated on Metal, and deliberately so: the
      # suite drives BenchmarkViewModel against a scripted stub engine, so no
      # MLX kernel ever runs and this job needs no MetalToolchain download.
      # (Anything that does need MLX belongs in the `metal` job instead.)
      #
      # The app is the tests' TEST_HOST, so it gets launched for real — hence
      # ad-hoc signing here rather than the CODE_SIGNING_ALLOWED=NO used for
      # the build-only step above; macOS will not execute a wholly unsigned
      # bundle. Reuses the same DerivedData the build step just populated.
      - name: Test macMLXTests (app target)
        run: |
          xcodebuild test \
            -project macMLX/macMLX.xcodeproj \
            -scheme macMLXTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile
